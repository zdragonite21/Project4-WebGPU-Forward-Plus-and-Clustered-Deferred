[package]
name = "forward-plus"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "forward-plus-renderer"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true

# image decoding is very slow unoptimized; optimize deps even in debug builds
[profile.dev.package."*"]
opt-level = 3

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.37"
egui-wgpu = "0.37"
# clipboard (arboard) does not build for wasm, so it is native-only below
egui-winit = { version = "0.37", default-features = false }
env_logger = "0.11.11"
glam = { version = "0.34", features = ["bytemuck"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
instant = "0.1.13"
log = "0.4.34"
pollster = "1.0.1"
rand = "0.10.3"
wesl-core = "0.1"
wgpu = "30"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37", features = ["clipboard", "links", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "Response"] }
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
instant = { version = "0.1.13", features = ["wasm-bindgen"] }

[build-dependencies]
wesl = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
